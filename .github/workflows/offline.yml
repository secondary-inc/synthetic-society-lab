name: Offline verification
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -e '.[selection,sources,geometry]'
      - name: Verify pypdf 7 authored PDF compatibility
        run: |
          export CIVICLAB_PYPDF7_FIXTURE_TARGET="$(python -c 'import sysconfig; print(sysconfig.get_path("purelib"))')"
          python -m unittest discover -s tests -p 'test_pypdf7_fresh_install_compatibility.py' -v
      - name: Verify ordinary and isolated frozen offline groups
        run: python scripts/run_offline_ci_v1.py --output-dir ci-results/python-${{ matrix.python }}
      - name: Preserve isolated CI coverage and failure receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-ci-python-${{ matrix.python }}
          path: ci-results/python-${{ matrix.python }}/
          if-no-files-found: warn
      - run: civiclab validate-sources --fixture-only
